<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tire Sales Assistant - Professional Forms</title>
    <!-- Add HTML sanitization library -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.5/dist/purify.min.js"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- MAIN FORM AREA -->
        <div class="form-main">
            <!-- Header with branding and cost tracking -->
            <div class="app-header">
                <h1>Professional Tire Assistant</h1>
                <p class="subtitle">Expert guidance through intelligent forms</p>
            </div>

            <!-- Main form workspace -->
            <div class="form-workspace" id="form-workspace">
                <!-- Welcome form (initially visible) -->
                <div class="form-section" id="welcome-form-section">
                    <form id="welcome-form" data-form-type="welcome" action="javascript:void(0);" method="post">
                        <div class="form-group">
                            <label for="user_request">Tell me about your tire needs:</label>
                            <textarea 
                                id="user_request"
                                name="user_request" 
                                placeholder="e.g., I need winter tires for my 2019 Honda Civic"
                                required
                                rows="3"
                            ></textarea>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">
                                Get Started
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Loading indicator -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing your information...</p>
            </div>
        </div>

        <!-- AI NOTEPAD SIDEBAR -->
        <div class="notepad-sidebar" id="notepad-sidebar">
            <div class="notepad-header">
                <h3>Thoughts 💭</h3>
                <button class="notepad-toggle" id="notepad-toggle">Hide</button>
            </div>
            <div class="notepad-content" id="notepad-content">
                <em>Your AI assistant is ready to help. Information gathered during our conversation will appear here...</em>
            </div>
        </div>

        <!-- Mobile notepad indicator -->
        <div class="notepad-indicator" id="notepad-indicator" style="display: none;">
            View Thoughts 💭
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="/static/app.js"></script>
</body>
</html>
